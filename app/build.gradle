plugins {
  id 'com.android.application'
}

android {
  compileSdkVersion 33

  defaultConfig {
    minSdkVersion 1
    targetSdkVersion 33
  }

  /* just delete the signing configs if it doesn't work */
  signingConfigs {
    def keystorePropertiesFiles = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    
    // Only load keystore if the file exists
    if (keystorePropertiesFiles.exists()) {
      try {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFiles))
        
        basic {
          // Validate all required properties exist before using them
          if (keystoreProperties['storeFile'] && 
              keystoreProperties['storePassword'] && 
              keystoreProperties['keyAlias'] && 
              keystoreProperties['keyPassword']) {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
          }
        }
      } catch (Exception e) {
        logger.warn("Failed to load keystore properties: ${e.message}")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      crunchPngs true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      // Only use signing config if keystore is available
      if (signingConfigs.findByName('basic')) {
        signingConfig signingConfigs.basic
      }
    }
    debug {
      // Only use signing config if keystore is available
      if (signingConfigs.findByName('basic')) {
        signingConfig signingConfigs.basic
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_16
    targetCompatibility JavaVersion.VERSION_16
  }
}